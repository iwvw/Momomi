  <!-- brand -->
  <text x="66" y="150" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="76" font-weight="700" letter-spacing="-1" fill="#E6EDF3">Momomi</text>
  <text x="66" y="60" font-family="'Cascadia Code','Consolas','SFMono-Regular',ui-monospace,monospace" font-size="13" letter-spacing="2" fill="#5A6675">MIHOMO KERNEL · WINDOWS CLIENT</text>
  <text x="66" y="200" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="22" fill="#E6EDF3">Windows 上的 mihomo 代理客户端</text>
  <text x="66" y="232" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="17" fill="#8B98A5">订阅、代理组、TUN、实时连接与流量统计。</text>

  <g><rect x="64" y="286" width="72.36" height="26" rx="13" fill="#0F1620" stroke="#243040"/><text x="100.18" y="303" font-family="'Cascadia Code','Consolas','SFMono-Regular',ui-monospace,monospace" font-size="13" fill="#3FB950" text-anchor="middle">v0.7.1</text></g>
