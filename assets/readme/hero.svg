<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Momomi — Windows 上的 mihomo 代理客户端</title>
  <desc id="desc">Momomi 是一个基于 mihomo 内核的 Windows 代理客户端，支持规则/全局/直连三种模式、系统代理与 TUN、订阅与代理组、实时连接和流量统计。右侧用路由示意图表示应用流量经 Momomi 分流到不同节点。</desc>

  <rect width="1200" height="400" fill="#0B0F14"/>
  <g stroke="#161F2B" stroke-width="1" opacity="0.55">
    <line x1="40" y1="0" x2="40" y2="400"/>
